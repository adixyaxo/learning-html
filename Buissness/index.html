<!-- HTML language contains elements -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
 </head>
 <body>


  <style>
  .SUBSCRIBE{
    background-color: rgb(200, 0, 0);
    color: white;
    border: none;
    height: 40px;
    width: 100px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 10px;
  }
  .SUBSCRIBE:hover{
    background-color: rgb(255, 20, 20);
    color: black;
  }
  .SUBSCRIBE:active{
    opacity: 0.6;
  }
  .join{
    background-color: rgb(255, 255, 255);
    color: blue;
    border: 1;
    border-color: blue;
    height: 40px;
    width: 70px;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 10px;
    transition: background-color 1s , colour 1s , border-color 1s;
  }
  .join:hover{
    background-color: blue;
    color:  rgb(255, 255, 255);
    border-color: whitesmoke;
  }
  .join:active{
    opacity: 0.6;
  }
 </style>
 <button class="SUBSCRIBE">SUBSCRIBE</button>
 <button class="join">JOIN</button>


 </body>
 </html>
